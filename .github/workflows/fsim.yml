name: standalone-vta-fsim

on:
  push:
  pull_request:

jobs:
  fsim:
    strategy:
      matrix:
        os: [macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: apache/tvm
          ref: v0.17.0
          path: tvm
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: tvm_py310
          python-version: "3.10"
      - name: Install Python dependencies
        shell: bash -el {0}
        run: python -m pip install 'numpy<1.24' scipy pytest cython
      - name: Build TVM host runtime
        shell: bash -el {0}
        run: |
          cmake -S tvm -B tvm/build -DUSE_LLVM=OFF -DUSE_RPC=ON
          cmake --build tvm/build --parallel 3
      - name: Run standalone VTA FSIM regression
        shell: bash -el {0}
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            export VTA_HOST_CC=/usr/bin/clang VTA_HOST_CXX=/usr/bin/clang++
          fi
          ./scripts/run_fsim_regression.sh
      - name: Enforce standalone compiler invariants
        shell: bash -el {0}
        run: |
          test -z "$(git -C tvm status --short)"
          grep -q 'VTA_MEM_ID_ACC_8BIT' runtime/runtime.cc
          grep -q 'test_resnet18_four_block_subgraph_and_profiler_metrics' tests/python/test_external_codegen_fsim.py
