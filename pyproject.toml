[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tvm-vta"
version = "0.1.0.dev0"
description = "Out-of-tree VTA compiler and runtime integration for Apache TVM"
requires-python = ">=3.8"
dependencies = ["numpy"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]

